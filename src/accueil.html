<title>Plans DJ RON</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : coquille d'application — barre latérale sur ordinateur, barre d'onglets en bas sur téléphone ; vues Accueil / Plans / Mises à jour / Studio (propriétaire) / fiche plan */
:root{
  --bg:#f2f1ee; --surface:#ffffff; --surface-2:#f7f6f3; --sunken:#e9e7e2; --ink:#141416; --ink-2:#55545a; --ink-3:#8a8890;
  --line:#e2e0da; --line-2:#cfccc4; --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#ffe9df; --indigo:#3b39e6;
  --ok:#14915a; --ok-soft:#dff3e8; --wip:#b86b00; --wip-soft:#fff0d6; --idea:#6d6b75; --idea-soft:#ecebef; --danger:#d23c3c;
  --shadow:0 1px 2px rgba(20,20,22,.06),0 8px 24px rgba(20,20,22,.06);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f12; --surface:#18181c; --surface-2:#1e1e23; --sunken:#26262c; --ink:#f3f2ef; --ink-2:#b7b5bd; --ink-3:#7f7d86;
  --line:#2a2a31; --line-2:#3a3a43; --accent:#ff6a33; --accent-ink:#160800; --accent-soft:#3a1d10; --indigo:#8c8bff;
  --ok:#4fd18f; --ok-soft:#12301f; --wip:#f2b24f; --wip-soft:#33250c; --idea:#a7a5b0; --idea-soft:#26262c; --danger:#ff7a7a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f0f12; --surface:#18181c; --surface-2:#1e1e23; --sunken:#26262c; --ink:#f3f2ef; --ink-2:#b7b5bd; --ink-3:#7f7d86;
  --line:#2a2a31; --line-2:#3a3a43; --accent:#ff6a33; --accent-ink:#160800; --accent-soft:#3a1d10; --indigo:#8c8bff;
  --ok:#4fd18f; --ok-soft:#12301f; --wip:#f2b24f; --wip-soft:#33250c; --idea:#a7a5b0; --idea-soft:#26262c; --danger:#ff7a7a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box;}
html,body{background:var(--bg);color:var(--ink);}
body{font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;}
a{color:inherit;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;}
.btn:hover{border-color:var(--ink-3);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);}
.btn.primary:hover{filter:brightness(1.05);}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);}
.btn.quiet:hover{background:var(--sunken);}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;}
.btn.icon{width:42px;padding:0;}
.btn.sm.icon{width:34px;}
.btn.danger{color:var(--danger);}
.btn:disabled{opacity:.45;cursor:default;transform:none;}

/* Coquille */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface);}
.logo{display:flex;align-items:center;gap:11px;padding:0 6px;}
.logo .mk{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 13px/1 var(--display);letter-spacing:.02em;position:relative;}
.logo .mk::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);}
.logo b{font:800 17px/1 var(--display);letter-spacing:-.01em;display:block;}
.logo small{font-size:12px;color:var(--ink-3);}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:11px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14.5px;}
.nav a:hover{background:var(--surface-2);color:var(--ink);}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg);}
.nav .sep{height:1px;background:var(--line);margin:10px 6px;}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;}
.side-foot b{font:700 14px var(--display);color:var(--ink);}
.role{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);}
.role.owner{background:var(--accent-soft);color:var(--accent);}

.content{min-width:0;padding:28px clamp(16px,4vw,44px) 120px;max-width:1180px;width:100%;}
.appbar{display:none;}
.tabs{display:none;}

/* Titres */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.pagehead h1{font:800 clamp(28px,4.4vw,40px)/1.05 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance;}
.pagehead p{margin:6px 0 0;color:var(--ink-2);}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:34px 0 14px;}
.sect h2{font:700 19px var(--display);letter-spacing:-.01em;margin:0;}
.link{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;cursor:pointer;padding:4px;}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.c-ready{background:var(--ok-soft);color:var(--ok);}
.c-wip{background:var(--wip-soft);color:var(--wip);}
.c-idea{background:var(--idea-soft);color:var(--idea);}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;}

/* Carte vedette */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);}
.hero .txt{padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;}
.hero .kick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.count{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:12px;background:var(--ink);color:var(--bg);}
.count b{font:800 22px/1 var(--display);letter-spacing:-.02em;}
.count span{font-size:12px;opacity:.75;}
.hero h3{font:800 clamp(34px,5vw,52px)/.95 var(--display);letter-spacing:-.03em;margin:0;}
.hero .sub{font-size:16px;color:var(--ink-2);margin:0;}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:13.5px;}
.facts span{display:inline-flex;align-items:center;gap:6px;}
.facts svg.i{width:16px;height:16px;color:var(--ink-3);}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.spec{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);}
.spec small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;}
.spec b{font:700 16px var(--display);}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px;}
.hero .vis{background:var(--sunken);display:flex;align-items:center;justify-content:center;padding:18px;position:relative;min-height:320px;}
.hero .vis svg{width:100%;max-width:320px;height:auto;}
.vis .badge{position:absolute;left:14px;top:14px;}

/* Mises à jour */
.feed{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
.feed .it{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;border-top:1px solid var(--line);}
.feed .it:first-child{border-top:0;}
.dotic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);}
.feed .t{font-size:14.5px;}
.feed .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.feed time{color:var(--ink-3);}
.empty{padding:28px;text-align:center;color:var(--ink-3);font-size:14px;}

/* Grille de plans */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--ink);font-size:14.5px;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filters button{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,280px);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;}
.rail>*{scroll-snap-align:start;}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s,border-color .18s;}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2);}
.cover{aspect-ratio:16/10;background:var(--sunken);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.cover img{width:100%;height:100%;object-fit:cover;}
.cover svg.plan{height:88%;width:auto;}
.cover .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;font-weight:600;}
.cover .ph b{font:800 34px/1 var(--display);color:var(--ink-2);letter-spacing:-.02em;}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--wip) 10%,transparent) 14px 28px);}
.cover .chip{position:absolute;left:12px;top:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;}
.card h4{font:700 18px/1.15 var(--display);letter-spacing:-.01em;margin:0;}
.card p{margin:0;font-size:13.5px;color:var(--ink-2);}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:var(--ink-3);font-size:12.5px;}
.bar{height:6px;border-radius:999px;background:var(--sunken);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;}

/* Fiche plan */
.back{margin-bottom:14px;}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start;}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.gallery button{padding:0;border:0;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--sunken);aspect-ratio:4/3;}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.gallery button:hover img{transform:scale(1.04);}

/* Studio (admin) */
.studio-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start;}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);}
.prow:first-child{border-top:0;}
.thumb{width:56px;height:42px;border-radius:9px;background:var(--sunken);overflow:hidden;display:grid;place-items:center;font:800 15px var(--display);color:var(--ink-3);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.prow b{font:700 15px var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:3px;}
.prow .a{display:flex;gap:4px;}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);}
.field input,.field select,.field textarea{height:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14.5px;font-weight:400;width:100%;}
.field textarea{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.5;}
.field small{font-weight:400;color:var(--ink-3);}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:500;}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;flex:none;}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked{background:var(--accent);}
.switch input:checked::after{transform:translateX(18px);}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;border:1.5px dashed var(--line-2);border-radius:14px;color:var(--ink-3);font-size:13.5px;cursor:pointer;text-align:center;}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.drop input{display:none;}
.pthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.pthumbs figure{margin:0;display:flex;flex-direction:column;gap:6px;position:relative;}
.pthumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;}
.pthumbs input{height:34px;padding:0 9px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--ink);}
.pthumbs .x{position:absolute;top:6px;right:6px;}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:30;max-width:calc(100vw - 24px);}
.savebar span{font-size:13.5px;font-weight:500;}
.savebar .btn{height:38px;}

/* Feuille (dialog) */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:24px;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.35);}
dialog::backdrop{background:rgba(10,10,12,.55);backdrop-filter:blur(3px);}
.sheet{display:flex;flex-direction:column;max-height:calc(100vh - 32px);}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}
.sheet-h h3{font:700 18px var(--display);margin:0;}
.sheet-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:16px;}
.sheet-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);}
dialog.lb{background:#000;width:min(1100px,calc(100vw - 16px));}
dialog.lb img{display:block;width:100%;max-height:80vh;object-fit:contain;}
.lb-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;color:#ddd;font-size:13.5px;}
.lb-cap .btn{background:#222;border-color:#333;color:#fff;}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);}
.skel{border-radius:18px;background:linear-gradient(90deg,var(--sunken),var(--surface-2),var(--sunken));background-size:200% 100%;animation:sh 1.2s infinite linear;}
@keyframes sh{to{background-position:-200% 0;}}
.fade{animation:fd .25s ease both;}
@keyframes fd{from{opacity:.001;transform:translateY(6px);}to{opacity:1;transform:none;}}

@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .side{display:none;}
  .appbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:600;border-radius:12px;}
  .tabs a[aria-current="page"]{color:var(--ink);}
  .tabs a[aria-current="page"] svg.i{color:var(--accent);}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));}
  .hero,.detail,.studio-grid{grid-template-columns:1fr;}
  .hero .vis{order:-1;min-height:220px;}
  .hero .txt{padding:20px;}
  .savebar{bottom:calc(76px + env(safe-area-inset-bottom,0px));}
  .fgrid{grid-template-columns:1fr;}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:92vh;}
  .sheet{max-height:92vh;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<div class="app">
  <aside class="side" aria-label="Navigation">
    <div class="logo"><div class="mk">RON</div><div><b>DJ RON</b><small>Plans d'implantation</small></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot"><span>Fait par</span><b>DJ RON</b><span id="roleSide" class="role" style="margin-top:8px;align-self:flex-start">Organisateur</span></div>
  </aside>
  <div>
    <header class="appbar">
      <div class="logo"><div class="mk">RON</div><div><b>DJ RON</b></div></div>
      <span id="roleTop" class="role">Organisateur</span>
    </header>
    <main class="content" id="view">
      <div class="skel" style="height:44px;width:260px;margin-bottom:22px"></div>
      <div class="skel" style="height:340px"></div>
    </main>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Navigation"></nav>
<dialog id="sheet"></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const $=s=>document.querySelector(s);
const ICON={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',

const STATUS={ready:['Prêt','c-ready'],wip:['En fabrication','c-wip'],idea:['À venir','c-idea']};
const onWeb=/github\.io$/.test(location.hostname);
let state=null,art=null,owner=false,dirty=false,filter='all',query='';
const pending=new Map(),blobUrls=new Map();
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmt=d=>{if(!d)return '';const [y,m,j]=d.split('-').map(Number);return `${j} ${MOIS[m-1]} ${y}`;};
const today=()=>new Date().toISOString().slice(0,10);
const daysTo=d=>{if(!d)return null;const t=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);};
const src=p=>blobUrls.get(p)||p;
const planLink=p=>onWeb?(p.webUrl||p.planUrl):(p.planUrl||p.webUrl);
const visible=()=>state.plans.filter(p=>p.visible!==false);
let toastT=0;function toast(t){const el=$('#toast');el.innerHTML=ic('check')+esc(t);el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3400);}

const chip=p=>{const [l,c]=STATUS[p.status]||STATUS.idea;return `<span class="chip ${c}">${l}</span>`;};

/* ---------- Navigation ---------- */
const ROUTES=[['home','Accueil','home'],['plans','Plans','grid'],['updates','Nouveautés','bell']];
function nav(){const cur=(location.hash.slice(1)||'home').split('-')[0];const items=ROUTES.concat(owner?[['studio','Studio','studio']]:[]);
  const link=([r,l,i])=>`<a href="#${r}" ${cur===r||(cur==='plan'&&r==='plans')?'aria-current="page"':''}>${ic(i)}<span>${l}</span></a>`;
  $('#sideNav').innerHTML=items.map(link).join('');$('#tabs').innerHTML=items.map(link).join('');
  const lab=owner?'Admin':'Organisateur';['#roleSide','#roleTop'].forEach(s=>{const e=$(s);e.textContent=lab;e.classList.toggle('owner',owner);});}
function route(){if(!state)return;let h=location.hash.slice(1)||'home';if(h==='studio'&&!owner)h='home';
  const v=$('#view');v.className='content fade';void v.offsetWidth;
  if(h.startsWith('plan-'))v.innerHTML=detailView(h.slice(5));else v.innerHTML=({home:homeView,plans:plansView,updates:updatesView,studio:studioView}[h]||homeView)();
  nav();window.scrollTo(0,0);if(h==='studio')bindStudio();if(h==='plans')bindPlans();}
addEventListener('hashchange',route);

/* ---------- Vues organisateur ---------- */
function feedItems(list){return list.length?list.map(u=>{const p=state.plans.find(x=>x.id===u.plan);
  return `<div class="it"><div class="dotic">${ic(p?'cube':'spark')}</div><div><div class="t">${esc(u.text)}</div><div class="meta">${p?esc(p.name)+' · ':''}<time datetime="${esc(u.date)}">${fmt(u.date)}</time></div></div>${p?`<a class="btn sm quiet icon" href="#plan-${esc(p.id)}" aria-label="Voir ${esc(p.name)}">${ic('arrow')}</a>`:'<span></span>'}</div>`;}).join(''):'<div class="empty">Aucune nouveauté pour l’instant.</div>';}
const sortedUps=()=>state.updates.slice().sort((a,b)=>b.date.localeCompare(a.date));
function card(p){const pr=+p.progress||0;return `<a class="card" href="#plan-${esc(p.id)}"><div class="cover">${cover(p)}${chip(p)}</div><div class="bd"><h4>${esc(p.name)}</h4><p>${esc(p.title||'Événement à définir')}</p>
  ${p.status!=='ready'&&pr>0?`<div class="bar" style="margin-top:10px" aria-label="Avancement ${pr} %"><i style="width:${pr}%"></i></div>`:''}
  <div class="row"><span>${p.date?ic('cal')+' '+fmt(p.date):(p.venue&&p.venue!=='À définir'?esc(p.venue):'Date à définir')}</span>${ic('arrow')}</div></div></a>`;}
function homeView(){
  const ready=visible().filter(p=>p.status==='ready').sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));const p=ready[0];
  let hero='';if(p){const d=daysTo(p.date),link=planLink(p);
    hero=`<article class="hero"><div class="txt"><div class="kick">${d!==null&&d>=0?`<span class="count"><b>J-${d}</b><span>avant la soirée</span></span>`:''}${chip(p)}</div>
    <h3>${esc(p.name)}</h3><p class="sub">${esc(p.title)}</p>
    <div class="facts">${p.date?`<span>${ic('cal')}${fmt(p.date)}</span>`:''}${p.venue?`<span>${ic('pin')}${esc(p.venue)}</span>`:''}${p.organizer?`<span>${ic('user')}${esc(p.organizer)}</span>`:''}</div>
    ${p.specs&&p.specs.length?`<div class="specs">${p.specs.map(([k,v])=>`<div class="spec"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}
    <div class="acts">${link?`<a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">${ic('cube')}Ouvrir en 3D</a>`:''}${p.pdf?`<a class="btn" href="${esc(p.pdf)}" target="_blank" rel="noopener">${ic('file')}Fiche matériel</a>`:''}<a class="btn quiet" href="#plan-${esc(p.id)}">${ic('image')}Photos (${p.photos.length})</a></div></div>
    <div class="vis">${cover(p)}</div></article>`;}
  const others=visible().filter(x=>x!==p);
  return `<div class="pagehead"><div><h1>Prochaine soirée</h1><p>Le plan, le matériel et les photos du lieu, au même endroit.</p></div></div>${hero}
  <div class="sect"><h2>Nouveautés</h2><a class="link" href="#updates">Tout voir ${ic('arrow')}</a></div><div class="feed">${feedItems(sortedUps().slice(0,3))}</div>
  <div class="sect"><h2>Tous les plans</h2><a class="link" href="#plans">Voir la liste ${ic('arrow')}</a></div><div class="rail">${others.map(card).join('')}</div>`;}
function plansView(){const n=visible().length;
  return `<div class="pagehead"><div><h1>Plans</h1><p>${n} plan${n>1?'s':''} : salles, péniches et prochains lieux.</p></div></div>
  <div class="toolbar"><label class="search">${ic('search')}<input id="q" type="search" placeholder="Chercher un plan, un lieu" value="${esc(query)}" aria-label="Chercher un plan"></label>
  <div class="filters" id="filters">${[['all','Tous'],['ready','Prêts'],['wip','En fabrication'],['idea','À venir']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div></div>
  <div class="grid" id="pgrid"></div>`;}
function bindPlans(){const draw=()=>{const q=query.toLowerCase();const list=visible().filter(p=>(filter==='all'||p.status===filter)&&(!q||[p.name,p.title,p.venue,p.organizer].join(' ').toLowerCase().includes(q)));
    $('#pgrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Aucun plan ne correspond.</div>';};draw();
  $('#q').addEventListener('input',e=>{query=e.target.value;draw();});
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});}
function updatesView(){return `<div class="pagehead"><div><h1>Nouveautés</h1><p>Chaque changement apporté aux plans.</p></div></div><div class="feed">${feedItems(sortedUps())}</div>`;}
function detailView(id){const p=state.plans.find(x=>x.id===id&&(owner||x.visible!==false));if(!p)return `<div class="empty">Ce plan n’existe pas ou n’est plus visible.</div>`;
  const link=planLink(p),pr=+p.progress||0,d=daysTo(p.date);
  return `<a class="btn sm quiet back" href="#plans">${ic('back')}Plans</a>
  <div class="detail"><div class="panelc" style="padding:0;overflow:hidden"><div class="cover" style="aspect-ratio:4/3">${cover(p)}${chip(p)}</div></div>
  <div class="panelc"><div class="kick" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${p.status==='ready'&&d!==null&&d>=0?`<span class="count"><b>J-${d}</b><span>avant la soirée</span></span>`:''}</div>
    <h1 style="font:800 clamp(30px,4vw,44px)/1 var(--display);letter-spacing:-.03em;margin:0">${esc(p.name)}</h1><p style="margin:0;color:var(--ink-2);font-size:16px">${esc(p.title)}</p>
    <div class="facts">${p.date?`<span>${ic('cal')}${fmt(p.date)}</span>`:''}${p.venue?`<span>${ic('pin')}${esc(p.venue)}</span>`:''}${p.organizer?`<span>${ic('user')}${esc(p.organizer)}</span>`:''}</div>
    ${p.status!=='ready'&&pr>0?`<div><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:6px"><span>Avancement</span><span class="mono">${pr} %</span></div><div class="bar"><i style="width:${pr}%"></i></div></div>`:''}
    <p style="margin:0">${esc(p.desc)}</p>
    ${p.specs&&p.specs.length?`<div class="specs">${p.specs.map(([k,v])=>`<div class="spec"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}
    <div style="display:flex;flex-wrap:wrap;gap:8px">${link?`<a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">${ic('cube')}Ouvrir en 3D</a>`:`<span class="btn" aria-disabled="true" style="opacity:.55;cursor:default">${ic('cube')}3D bientôt disponible</span>`}${p.pdf?`<a class="btn" href="${esc(p.pdf)}" target="_blank" rel="noopener">${ic('file')}Fiche matériel</a>`:''}</div></div></div>
  <div class="sect"><h2>Photos du lieu</h2><span class="mono" style="color:var(--ink-3)">${p.photos.length}</span></div>
  ${p.photos.length?`<div class="gallery">${p.photos.map((ph,i)=>`<button data-lb="${esc(p.id)}:${i}" aria-label="Agrandir : ${esc(ph.caption||'photo')}"><img src="${esc(src(ph.src))}" alt="${esc(ph.caption)}" loading="lazy"></button>`).join('')}</div>`:'<div class="feed"><div class="empty">Pas encore de photos pour ce lieu.</div></div>'}`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lb]');if(!b)return;const [id,i]=b.dataset.lb.split(':');lightbox(id,+i);});
function lightbox(id,i){const p=state.plans.find(x=>x.id===id);const dl=$('#sheet');dl.className='lb';
  const draw=()=>{const ph=p.photos[i];dl.innerHTML=`<img src="${esc(src(ph.src))}" alt="${esc(ph.caption)}"><div class="lb-cap"><span>${esc(ph.caption||'')} <span class="mono" style="opacity:.6">${i+1}/${p.photos.length}</span></span><span style="display:flex;gap:6px"><button class="btn sm icon" data-n="-1" aria-label="Précédente">${ic('back')}</button><button class="btn sm icon" data-n="1" aria-label="Suivante">${ic('arrow')}</button><button class="btn sm" data-close>Fermer</button></span></div>`;};
  draw();dl.onclick=e=>{const b=e.target.closest('button');if(e.target===dl||b&&b.hasAttribute('data-close')){dl.close();return;}if(b&&b.dataset.n){i=(i+(+b.dataset.n)+p.photos.length)%p.photos.length;draw();}};dl.showModal();}

/* ---------- Studio (propriétaire) ---------- */
function studioView(){
  return `<div class="pagehead"><div><h1>Studio</h1><p>Tes plans, tes photos et les nouveautés. Visible par toi seul.</p></div><button class="btn primary" id="newPlan">${ic('plus')}Nouveau plan</button></div>
  <div class="studio-grid"><section><div class="sect" style="margin-top:0"><h2>Plans</h2></div><div class="rows">${state.plans.map((p,i)=>`<div class="prow">
    <div class="thumb">${p.photos[0]?`<img src="${esc(src(p.photos[0].src))}" alt="">`:esc((p.name||'?').slice(0,2).toUpperCase())}</div>
    <div style="min-width:0"><b>${esc(p.name||'Sans nom')}</b><div class="m">${chip(p)}<span>${p.visible!==false?'Visible':'Masqué'} pour l’organisateur</span>${p.photos.length?`<span>${p.photos.length} photo${p.photos.length>1?'s':''}</span>`:''}</div></div>
    <div class="a"><button class="btn sm icon quiet" data-mv="${i}:-1" ${i===0?'disabled':''} aria-label="Monter">${ic('up')}</button><button class="btn sm icon quiet" data-mv="${i}:1" ${i===state.plans.length-1?'disabled':''} aria-label="Descendre">${ic('down')}</button>
    <button class="btn sm icon quiet" data-vis="${i}" aria-label="${p.visible!==false?'Masquer':'Afficher'} pour l’organisateur">${ic(p.visible!==false?'eye':'eyeoff')}</button><button class="btn sm" data-edit="${i}">${ic('edit')}Modifier</button></div></div>`).join('')}</div></section>
  <section><div class="sect" style="margin-top:0"><h2>Nouveauté</h2></div><div class="panelc">
    <label class="field">Plan concerné<select id="uPlan"><option value="">Général</option>${state.plans.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label>
    <label class="field">Texte<textarea id="uText" placeholder="Ex. : plan Péniche, première implantation des enceintes"></textarea></label>
    <button class="btn dark" id="uAdd">${ic('plus')}Ajouter aux nouveautés</button></div>
    <div class="feed" style="margin-top:12px">${state.updates.length?state.updates.map((u,i)=>`<div class="it" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="t">${esc(u.text)}</div><div class="meta">${fmt(u.date)}</div></div><button class="btn sm icon quiet danger" data-delup="${i}" aria-label="Retirer">${ic('trash')}</button></div>`).join(''):'<div class="empty">Aucune nouveauté.</div>'}</div></section></div>
  ${dirty?saveBar():''}`;}
const saveBar=()=>`<div class="savebar" id="savebar"><span>Modifications non enregistrées</span><button class="btn primary" id="save">Enregistrer</button></div>`;
function setDirty(){dirty=true;if(!$('#savebar')&&location.hash==='#studio'){$('#view').insertAdjacentHTML('beforeend',saveBar());$('#save').onclick=save;}}
function bindStudio(){const v=$('#view');
  $('#newPlan').onclick=()=>{const p={id:'plan-'+Date.now().toString(36),name:'',title:'',venue:'',date:'',organizer:'',status:'wip',progress:0,visible:true,planUrl:'',webUrl:'',pdf:'',desc:'',photos:[],specs:[]};editPlan(p,true);};
  $('#uAdd').onclick=()=>{const t=$('#uText').value.trim();if(!t){$('#uText').focus();toast('Écris le texte de la nouveauté');return;}state.updates.unshift({date:today(),plan:$('#uPlan').value,text:t});dirty=true;route();toast('Nouveauté ajoutée');};
  if($('#save'))$('#save').onclick=save;
  v.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.edit)editPlan(state.plans[+b.dataset.edit],false);
    else if(b.dataset.vis){const p=state.plans[+b.dataset.vis];p.visible=p.visible===false;dirty=true;route();}
    else if(b.dataset.mv){const [i,s]=b.dataset.mv.split(':').map(Number);const j=i+s;[state.plans[i],state.plans[j]]=[state.plans[j],state.plans[i]];dirty=true;route();}
    else if(b.dataset.delup){state.updates.splice(+b.dataset.delup,1);dirty=true;route();}};}
function editPlan(orig,isNew){const p=JSON.parse(JSON.stringify(orig));const dl=$('#sheet');dl.className='';
  const F=(k,l,t='text',ph='')=>`<label class="field">${l}<input type="${t}" data-k="${k}" value="${esc(p[k])}" placeholder="${esc(ph)}"></label>`;
  const draw=()=>{dl.innerHTML=`<div class="sheet"><div class="sheet-h"><h3>${isNew?'Nouveau plan':'Modifier le plan'}</h3><button class="btn sm icon quiet" data-close aria-label="Fermer">${ic('x')}</button></div>
    <div class="sheet-b">
    <div class="fgrid">${F('name','Nom du plan','text','Ex. : Péniche')}${F('title','Événement','text','Ex. : Soirée d’anniversaire')}${F('venue','Lieu')}${F('date','Date','date')}${F('organizer','Organisateur')}
    <label class="field">Statut<select data-k="status">${Object.entries(STATUS).map(([k,[l]])=>`<option value="${k}" ${p.status===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="field">Avancement (%)<input type="number" min="0" max="100" step="5" data-k="progress" value="${+p.progress||0}"></label></div>
    <label class="field">Description<textarea data-k="desc">${esc(p.desc)}</textarea></label>
    <label class="field">Chiffres clés <small>Une ligne par élément, sous la forme « Enceintes : 15 »</small><textarea data-specs>${esc((p.specs||[]).map(([a,b])=>a+' : '+b).join('\n'))}</textarea></label>
    <div class="fgrid">${F('planUrl','Lien du plan 3D','url','https://claude.ai/artifact/…')}${F('pdf','Lien de la fiche matériel','text','docs/…pdf')}</div>
    <label class="switch">Visible pour l’organisateur<input type="checkbox" data-k="visible" ${p.visible!==false?'checked':''}></label>
    <div class="field">Photos du lieu<div class="pthumbs">${p.photos.map((ph,j)=>`<figure><img src="${esc(src(ph.src))}" alt=""><button class="btn sm icon x" data-delph="${j}" aria-label="Retirer la photo">${ic('x')}</button><input data-cap="${j}" value="${esc(ph.caption)}" placeholder="Légende"></figure>`).join('')}</div>
    <label class="drop" id="drop">${ic('upload')}<span><b>Ajouter des photos</b><br>Clique ou dépose des images ici</span><input type="file" accept="image/*" multiple id="pick"></label></div>
    ${isNew?'':'<button class="btn danger quiet" data-delplan style="align-self:flex-start">'+ic('trash')+'Supprimer ce plan</button>'}</div>
    <div class="sheet-f"><button class="btn quiet" data-close>Annuler</button><button class="btn primary" data-ok>${ic('check')}Valider</button></div></div>`;};
  const add=async files=>{toast('Préparation des photos…');for(const f of files){if(!f.type.startsWith('image/'))continue;try{const b=await shrink(f);const path=`photos/${p.id}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}.jpg`;pending.set(path,b);blobUrls.set(path,URL.createObjectURL(b));p.photos.push({src:path,caption:''});}catch(err){toast('Une photo n’a pas pu être lue');}}draw();};
  draw();
  dl.oninput=e=>{const t=e.target;if(t.dataset.k)p[t.dataset.k]=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(0,Math.min(100,+t.value||0)):t.value;
    if(t.dataset.cap!==undefined)p.photos[+t.dataset.cap].caption=t.value;
    if(t.hasAttribute('data-specs'))p.specs=t.value.split('\n').map(l=>l.split(/\s*:\s*/)).filter(a=>a[0]&&a[1]).map(a=>[a[0].trim(),a.slice(1).join(':').trim()]);};
  dl.onchange=e=>{if(e.target.id==='pick'&&e.target.files.length)add([...e.target.files]);};
  dl.ondragover=e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}};
  dl.ondragleave=e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over');};
  dl.ondrop=e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();add([...e.dataTransfer.files]);}};
  dl.onclick=e=>{const b=e.target.closest('button');if(e.target===dl){dl.close();return;}if(!b)return;
    if(b.hasAttribute('data-close'))dl.close();
    else if(b.dataset.delph!==undefined){p.photos.splice(+b.dataset.delph,1);draw();}
    else if(b.hasAttribute('data-delplan')){if(b.dataset.sure){state.plans=state.plans.filter(x=>x.id!==orig.id);dl.close();dirty=true;route();toast('Plan supprimé, pense à enregistrer');}else{b.dataset.sure='1';b.innerHTML=ic('trash')+'Confirmer la suppression';}}
    else if(b.hasAttribute('data-ok')){if(!p.name.trim()){toast('Donne un nom au plan');dl.querySelector('[data-k="name"]').focus();return;}
      if(isNew)state.plans.push(p);else Object.assign(orig,p);dl.close();dirty=true;route();toast(isNew?'Plan créé, pense à enregistrer':'Plan modifié, pense à enregistrer');}};
  dl.showModal();}
async function shrink(file){const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.84));}
async function save(){const b=$('#save');if(!art||!owner){toast('Enregistrement réservé à l’admin, sur la page Claude');return;}
  b.disabled=true;b.textContent='Enregistrement…';
  const used=new Set(state.plans.flatMap(p=>p.photos.map(x=>x.src)));
  state.version=(state.version||0)+1;state.savedAt=new Date().toISOString();
  const files={'data/state.json':{content:JSON.stringify(state,null,1),contentType:'application/json'}};
  for(const [path,blob] of pending)if(used.has(path))files[path]=blob;
  try{await art.publish(files);pending.clear();dirty=false;$('#savebar')?.remove();toast('Enregistré : l’organisateur voit la nouvelle version');}
  catch(err){const c=err&&err.code;b.disabled=false;b.textContent='Enregistrer';
    toast(c==='conflict'?'Une autre version a été enregistrée, la page va se recharger':c==='capability_disabled'?'Enregistrement indisponible dans cette vue':c==='not_writer'||c==='not_granted'?'Pas de droits d’enregistrement ici':'Échec de l’enregistrement ('+(c||'erreur')+')');}}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

/* ---------- Démarrage ---------- */
fetch('data/state.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(s=>{state=s;s.plans.forEach(p=>{p.photos=p.photos||[];p.specs=p.specs||[];});nav();route();})
  .catch(()=>{$('#view').innerHTML='<div class="empty">Les plans n’ont pas pu être chargés. Recharge la page.</div>';});
(async()=>{if(!(window.claude&&typeof window.claude.use==='function'))return;
  const [a,u]=await Promise.all([window.claude.use('artifact').catch(()=>null),window.claude.use('user').catch(()=>null)]);
  art=a;owner=!!(u&&await u.isOwner().catch(()=>false));if(owner&&state){nav();if(location.hash==='#studio')route();}})();
</script>
