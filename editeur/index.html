<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="../assets/icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Studio d'implantation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : outil plein écran — barre d'outils en haut, catalogue à gauche, plan 2D / 3D au centre, propriétés et inventaire à droite ; sur téléphone, panneaux en tiroirs et barre d'actions en bas */
:root{
  --bg:#0c0d10; --panel:#14161b; --panel-2:#1b1e25; --raise:#232731; --line:#2a2e38; --line-2:#3a3f4c;
  --ink:#eef0f4; --ink-2:#b4b8c4; --ink-3:#7d8291; --accent:#ff5a1f; --accent-ink:#1a0800; --accent-soft:#3a1a0d;
  --ok:#3ccf8e; --warn:#f2b24f; --danger:#ff6b6b; --sel:#5aa9ff;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --dur:160ms; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;overflow:hidden;}
body{font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased;}
html,body,button,a,input,select,label{touch-action:manipulation;}
button,input,select,textarea{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;}
/* Barre d'outils */
.top{display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0;}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px;flex:none;}
.mk{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 11px var(--display);position:relative;}
.mk::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);}
.brand b{font:800 15px var(--display);letter-spacing:-.01em;}
.sel{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);padding:0 10px;color:var(--ink);max-width:200px;}
.grp{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);flex:none;}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 9px;border-radius:8px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:background var(--dur),color var(--dur);}
.tb:hover{background:var(--raise);color:var(--ink);}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
.tb:disabled{opacity:.35;cursor:default;}
.sp{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background var(--dur),border-color var(--dur),transform 90ms;}
.btn:hover{border-color:var(--ink-3);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px;}
.btn.danger{color:var(--danger);}
.btn.is-loading{pointer-events:none;opacity:.8;}
.btn.is-loading::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none;}
.is-dirty .dirty-dot{display:inline-block;}
/* Corps */
.body{display:grid;grid-template-columns:286px minmax(0,1fr) 300px;min-height:0;}
.side{background:var(--panel);display:flex;flex-direction:column;min-height:0;}
.left{border-right:1px solid var(--line);}
.right{border-left:1px solid var(--line);}
.ph{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);}
.ph h2{font:800 15px var(--display);margin:0;display:flex;align-items:center;justify-content:space-between;}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-3);}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--ink);}
.cats{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.cats button{flex:none;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.cats button i{width:8px;height:8px;border-radius:50%;}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.scroll{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain;}
.cat-h{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:14px 12px 6px;display:flex;align-items:center;gap:7px;}
.cat-h i{width:8px;height:8px;border-radius:2px;}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 10px;}
.tile{display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:grab;user-select:none;-webkit-user-select:none;text-align:left;transition:border-color var(--dur),transform var(--dur) var(--ease),background var(--dur);min-height:44px;touch-action:pan-y;}
.tile:hover{border-color:var(--line-2);background:var(--raise);transform:translateY(-1px);}
.tile:active{cursor:grabbing;}
.tile svg.sym{width:100%;height:46px;}
.tile b{font-size:12px;font-weight:600;line-height:1.25;}
.tile small{font:500 10.5px var(--mono);color:var(--ink-3);}
/* Plan */
.stagewrap{position:relative;min-width:0;min-height:0;display:grid;}
.split .stagewrap{grid-template-columns:1fr 1fr;}
#cv{width:100%;height:100%;display:block;background:#0f1115;touch-action:none;cursor:default;}
#cv.pan{cursor:grab;}
#cv.cable,#cv.zone,#cv.measure{cursor:crosshair;}
#v3{position:relative;min-width:0;min-height:0;background:#0b0c0f;}
#v3 canvas{display:block;width:100%;height:100%;}
.v3note{position:absolute;inset:auto 12px 12px 12px;font-size:12px;color:var(--ink-3);}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;}
.hud>*{pointer-events:auto;}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:rgba(20,22,27,.88);border:1px solid var(--line);font:500 12px var(--mono);color:var(--ink-2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.zoomb{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;}
.zoomb button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(20,22,27,.9);color:var(--ink);cursor:pointer;display:grid;place-items:center;}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:10px;background:rgba(20,22,27,.92);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;}
/* Panneau droit */
.tabsr{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);}
.tabsr button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;cursor:pointer;}
.tabsr button[aria-pressed="true"]{background:var(--raise);color:var(--ink);}
.pane{padding:12px;display:flex;flex-direction:column;gap:12px;}
.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;}
.f input,.f select{height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);padding:0 9px;color:var(--ink);font-size:13.5px;font-weight:400;width:100%;}
.f input[type=range]{padding:0;height:24px;accent-color:var(--accent);}
.f input[type=color]{padding:2px;height:34px;}
.fr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.fr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:12px;display:flex;flex-direction:column;gap:8px;}
.card h3{font:800 14px var(--display);margin:0;}
.muted{color:var(--ink-3);font-size:12.5px;}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
.kv b{font-family:var(--mono);font-weight:500;}
.inv{display:flex;flex-direction:column;}
.inv div{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
.inv div:first-child{border-top:0;}
.inv .n{font:600 13px var(--mono);color:var(--accent);}
.inv small{color:var(--ink-3);font-family:var(--mono);font-size:11px;}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.chk{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;}
.chk input{appearance:none;width:36px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background var(--dur);}
.chk input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform var(--dur);}
.chk input:checked{background:var(--accent);}
.chk input:checked::after{transform:translateX(14px);}
.bar{height:8px;border-radius:999px;background:var(--raise);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--ok);}
.bar.hot i{background:var(--warn);}
.bar.over i{background:var(--danger);}
.cablek{display:flex;flex-wrap:wrap;gap:5px;}
.cablek button{height:28px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.cablek button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--raise);}
.cablek i{width:14px;height:3px;border-radius:2px;}
/* Mobile */
.mbar{display:none;}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px);}
dialog{border:1px solid var(--line-2);border-radius:18px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);}
dialog::backdrop{background:rgba(0,0,0,.6);}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:calc(100vh - 40px);}
kbd{font:500 11.5px var(--mono);padding:2px 6px;border-radius:5px;background:var(--raise);border:1px solid var(--line-2);}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center;}
@media (hover:none),(max-width:900px){input,select,textarea{font-size:16px!important;}}
@media (max-width:1100px){.body{grid-template-columns:250px minmax(0,1fr) 270px;}.hide-md{display:none!important;}}
@media (max-width:820px){
  .body{grid-template-columns:1fr;}
  .split .stagewrap{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}
  .side{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:62vh;border:1px solid var(--line);border-radius:18px 18px 0 0;z-index:40;box-shadow:0 -20px 50px rgba(0,0,0,.5);transform:translateY(110%);transition:transform var(--dur-sheet,280ms) var(--ease);}
  .side.open{transform:none;}
  .hide-sm{display:none!important;}
  .top{gap:6px;flex-wrap:wrap;}
  .top .sp{display:none;}
  #proj{flex:1;min-width:0;max-width:none;}
  #tools,#views{order:10;}
  #tools{flex:1;justify-content:space-between;}
  #help{display:none;}
  .brand b{display:none;}
  .mbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--panel);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));}
  .mbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--ink-3);font-size:10.5px;font-weight:600;padding:5px 0;cursor:pointer;border-radius:10px;}
  .mbar button[aria-pressed="true"]{color:var(--ink);}
  .mbar button[aria-pressed="true"] svg.i{color:var(--accent);}
  .stagewrap{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));}
  .hud{bottom:calc(70px + env(safe-area-inset-bottom,0px));}
  .zoomb{bottom:calc(70px + env(safe-area-inset-bottom,0px));}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="mk">RON</div><b>Studio</b></div>
    <select class="sel" id="proj" aria-label="Projet"></select>
    <div class="grp" role="group" aria-label="Historique"><button class="tb" id="undo" aria-label="Annuler (Ctrl+Z)" title="Annuler (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button class="tb" id="redo" aria-label="Rétablir (Ctrl+Y)" title="Rétablir (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button></div>
    <div class="grp" role="group" aria-label="Outils" id="tools">
      <button class="tb" data-tool="select" aria-pressed="true" title="Sélection (V)"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span class="hide-md">Sélection</span></button>
      <button class="tb" data-tool="cable" aria-pressed="false" title="Câble (C)"><svg class="i" viewBox="0 0 24 24"><path d="M4 18c4 0 4-12 8-12s4 12 8 12"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="18" r="1.5"/></svg><span class="hide-md">Câble</span></button>
      <button class="tb" data-tool="zone" aria-pressed="false" title="Zone (Z)"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" stroke-dasharray="3 3"/></svg><span class="hide-md">Zone</span></button>
      <button class="tb" data-tool="measure" aria-pressed="false" title="Mesure (M)"><svg class="i" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span class="hide-md">Mesure</span></button>
    </div>
    <div class="grp" role="group" aria-label="Vue" id="views">
      <button class="tb" data-view="2d" aria-pressed="true">2D</button><button class="tb" data-view="split" aria-pressed="false">2D + 3D</button><button class="tb" data-view="3d" aria-pressed="false">3D</button>
    </div>
    <span class="sp"></span>
    <button class="btn hide-sm" id="help" aria-label="Raccourcis clavier"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
    <button class="btn" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6"/><path d="M4 20h16"/></svg><span class="hide-sm">Exporter</span></button>
    <button class="btn primary" id="save"><span class="dirty-dot"></span><svg class="i" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span>Enregistrer</span></button>
  </header>
  <div class="body" id="body">
    <aside class="side left" id="left" aria-label="Catalogue">
      <div class="ph"><h2>Catalogue <span class="muted" id="catCount"></span></h2>
        <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Enceinte, lyre, câble, scène…" aria-label="Chercher dans le catalogue"></label>
        <div class="cats" id="cats"></div></div>
      <div class="scroll" id="catalog"></div>
      <div class="muted" style="padding:10px 12px;border-top:1px solid var(--line)">Glisse un élément sur le plan, ou touche-le pour l’ajouter au centre.</div>
    </aside>
    <main class="stagewrap" id="stage">
      <div style="position:relative;min-width:0;min-height:0" id="v2wrap">
        <svg id="cv" role="img" aria-label="Plan d’implantation vu du dessus"></svg>
        <div class="hint" id="hint" hidden></div>
        <div class="hud"><span class="pill" id="pos">x 0,0 · y 0,0 m</span><span class="pill" id="zoomp">100 %</span></div>
        <div class="zoomb"><button id="zin" aria-label="Zoomer">+</button><button id="zout" aria-label="Dézoomer">−</button><button id="zfit" aria-label="Recentrer"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      </div>
      <div id="v3" hidden><div class="v3note" id="v3note">Aperçu 3D en direct : glisser pour tourner, pincer ou molette pour zoomer.</div></div>
    </main>
    <aside class="side right" id="right" aria-label="Propriétés et inventaire">
      <div class="tabsr" id="rtabs"><button data-t="props" aria-pressed="true">Propriétés</button><button data-t="inv" aria-pressed="false">Inventaire</button><button data-t="calques" aria-pressed="false">Affichage</button></div>
      <div class="scroll"><div class="pane" id="pane"></div></div>
    </aside>
  </div>
</div>
<nav class="mbar" id="mbar" aria-label="Panneaux">
  <button data-p="left" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg>Catalogue</button>
  <button data-p="props" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Propriétés</button>
  <button data-p="inv" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h1M4 12h1M4 18h1"/></svg>Inventaire</button>
  <button data-p="calques" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Affichage</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgb"></div></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100, fr=n=>String(r2(n)).replace('.',',');

/* ================= Symboles 2D (unités : mètres, centrés) ================= */
function sym(def,it,flat){const w=it&&it.w||def.w,d=it&&it.d||def.d,col=it&&it.col||CATS[def.cat][1],hw=w/2,hd=d/2,ns='vector-effect="non-scaling-stroke"';
  const R=(x,y,ww,hh,f,s,rx=0.04,extra='')=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${Math.min(rx,ww/2,hh/2)}" fill="${f}" stroke="${s}" stroke-width="1.2" ${ns} ${extra}/>`;
  const base=R(-hw,-hd,w,d,col+'33',col);
  switch(def.s){
   case'stage':return R(-hw,-hd,w,d,'#2a2f3a',col,0.06)+`<path d="M${-hw} ${-hd}L${hw} ${hd}M${hw} ${-hd}L${-hw} ${hd}" stroke="${col}55" stroke-width="1" ${ns}/>`;
   case'steps':return base+[1,2,3].map(i=>`<line x1="${-hw}" x2="${hw}" y1="${-hd+i*d/4}" y2="${-hd+i*d/4}" stroke="${col}" stroke-width="1" ${ns}/>`).join('');
   case'rail':return R(-hw,-Math.max(hd,0.03),w,Math.max(d,0.06),col,col,0.01);
   case'truss':{let z='';const n=Math.max(2,Math.round(w/0.3));for(let i=0;i<n;i++){const x0=-hw+i*w/n,x1=x0+w/n;z+=`M${x0} ${i%2?hd:-hd}L${x1} ${i%2?-hd:hd}`;}return R(-hw,-hd,w,d,'none','#c3c9d6',0.01)+`<path d="${z}" stroke="#c3c9d6" stroke-width="1" fill="none" ${ns}/>`;}
   case'trussc':return R(-hw,-hd,w,d,'#c3c9d622','#c3c9d6',0.01)+`<path d="M${-hw} ${-hd}L${hw} ${hd}M${hw} ${-hd}L${-hw} ${hd}" stroke="#c3c9d6" stroke-width="1" ${ns}/>`;
   case'tower':case'tripod':return `<path d="M0 0L${-hw} ${hd}M0 0L${hw} ${hd}M0 0L0 ${-hd}" stroke="${col}" stroke-width="1.6" ${ns}/><circle r="${Math.min(hw,hd)*0.25}" fill="${col}"/>`;
   case'totem':return R(-hw,-hd,w,d,'#1b1e25',col,0.05)+R(-hw*0.5,-hd*0.5,w*0.5,d*0.5,col+'55',col,0.02);
   case'spk':case'line':case'col':return R(-hw,-hd,w,d,'#16181d',col,0.03)+`<line x1="${-hw*0.85}" x2="${hw*0.85}" y1="${hd}" y2="${hd}" stroke="${col}" stroke-width="3" ${ns}/><circle cy="${hd*0.15}" r="${Math.min(hw,hd)*0.55}" fill="none" stroke="${col}" stroke-width="1" ${ns}/>`;
   case'sub':return R(-hw,-hd,w,d,'#16181d',col,0.03)+`<line x1="${-hw*0.85}" x2="${hw*0.85}" y1="${hd}" y2="${hd}" stroke="${col}" stroke-width="3" ${ns}/><circle r="${Math.min(hw,hd)*0.7}" fill="${col}22" stroke="${col}" stroke-width="1" ${ns}/>`;
   case'wedge':return `<path d="M${-hw} ${hd}L${hw} ${hd}L${hw*0.7} ${-hd}L${-hw*0.7} ${-hd}Z" fill="#16181d" stroke="${col}" stroke-width="1.2" ${ns}/><line x1="${-hw*0.8}" x2="${hw*0.8}" y1="${hd}" y2="${hd}" stroke="${col}" stroke-width="3" ${ns}/>`;
   case'mic':return `<circle r="0.08" fill="${col}"/><path d="M0 0L${-hw*0.7} ${hd*0.7}M0 0L${hw*0.7} ${hd*0.7}M0 0L0 ${-hd*0.8}M0 0L0 ${hd}" stroke="${col}" stroke-width="1" ${ns}/>`;
   case'console':return R(-hw,-hd,w,d,'#16181d',col,0.03)+Array.from({length:8},(_,i)=>`<line x1="${-hw+(i+1)*w/9}" x2="${-hw+(i+1)*w/9}" y1="${-hd*0.1}" y2="${hd*0.8}" stroke="${col}" stroke-width="1" ${ns}/>`).join('')+R(-hw*0.8,-hd*0.85,w*0.5,d*0.35,col+'44',col,0.01);
   case'mh':return `<rect x="${-hw}" y="${-hd*0.35}" width="${w}" height="${d*0.7}" rx="0.04" fill="#16181d" stroke="${col}" stroke-width="1.2" ${ns}/><circle cy="${hd*0.15}" r="${Math.min(hw,hd)*0.62}" fill="${col}55" stroke="${col}" stroke-width="1.2" ${ns}/>`;
   case'par':return `<circle r="${Math.min(hw,hd)}" fill="#16181d" stroke="${col}" stroke-width="1.2" ${ns}/><circle r="${Math.min(hw,hd)*0.55}" fill="${col}88"/>`;
   case'ledbar':{let p='';const n=Math.max(3,Math.round(w/0.1));for(let i=0;i<n;i++)p+=`<circle cx="${-hw+(i+0.5)*w/n}" r="${Math.min(d*0.3,w/n*0.35)}" fill="${col}"/>`;return R(-hw,-hd,w,d,'#16181d',col,0.02)+p;}
   case'strobe':return R(-hw,-hd,w,d,'#16181d',col,0.02)+R(-hw*0.85,-hd*0.5,w*0.85,d*0.5,col+'aa',col,0.01);
   case'profile':return `<path d="M${-hw*0.6} ${-hd}L${hw*0.6} ${-hd}L${hw} ${hd}L${-hw} ${hd}Z" fill="#16181d" stroke="${col}" stroke-width="1.2" ${ns}/>`;
   case'laser':return R(-hw,-hd,w,d,'#16181d',col,0.02)+`<circle cy="${hd*0.6}" r="${hd*0.25}" fill="#3cff7a"/>`;
   case'ball':return `<circle r="${hw}" fill="url(#mirror)" stroke="${col}" stroke-width="1" ${ns}/>`;
   case'fx':return `<path d="M0 ${-hd}L${hw} 0L0 ${hd}L${-hw} 0Z" fill="${col}33" stroke="${col}" stroke-width="1.2" ${ns}/><circle r="${Math.min(hw,hd)*0.25}" fill="${col}"/>`;
   case'screen':return R(-hw,-hd,w,Math.max(d,0.08),'#0d1a24','#4cc9f0',0.01)+`<line x1="${-hw}" x2="${hw}" y1="${hd}" y2="${hd}" stroke="#4cc9f0" stroke-width="3" ${ns} opacity=".8"/>`;
   case'proj':return R(-hw,-hd,w,d,'#16181d',col,0.03)+`<circle cy="${hd*0.6}" r="${Math.min(hw,hd)*0.3}" fill="${col}"/>`;
   case'booth':return R(-hw,-hd,w,d,'#101216',col,0.05)+`<line x1="${-hw*0.95}" x2="${hw*0.95}" y1="${hd*0.92}" y2="${hd*0.92}" stroke="#ffd23f" stroke-width="2" ${ns}/>`;
   case'cdj':return R(-hw,-hd,w,d,'#16181d',col,0.02)+`<circle cy="${-hd*0.15}" r="${Math.min(hw,hd)*0.62}" fill="none" stroke="${col}" stroke-width="1.2" ${ns}/>`+R(-hw*0.6,hd*0.45,w*0.6,d*0.25,col+'55',col,0.01);
   case'mixer':return R(-hw,-hd,w,d,'#16181d',col,0.02)+[0,1,2,3].map(i=>`<line x1="${-hw*0.6+i*w*0.2}" x2="${-hw*0.6+i*w*0.2}" y1="${hd*0.1}" y2="${hd*0.7}" stroke="${col}" stroke-width="1.4" ${ns}/>`).join('');
   case'tt':return R(-hw,-hd,w,d,'#16181d',col,0.02)+`<circle cx="${-hw*0.2}" r="${Math.min(hw,hd)*0.75}" fill="none" stroke="${col}" stroke-width="1.2" ${ns}/>`;
   case'power':return R(-hw,-hd,w,d,'#2a1416',col,0.03)+`<path d="M${w*0.05} ${-hd*0.7}L${-w*0.12} ${d*0.05}L${w*0.04} ${d*0.05}L${-w*0.05} ${hd*0.7}L${w*0.15} ${-d*0.08}L${-w*0.02} ${-d*0.08}Z" fill="${col}"/>`;
   case'round':return `<circle r="${Math.min(hw,hd)}" fill="${col}22" stroke="${col}" stroke-width="1.2" ${ns}/>`;
   case'sofa':return `<path d="M${-hw} ${-hd}H${hw}V${hd}H${hw-d*0.22}V${-hd+d*0.3}H${-hw+d*0.22}V${hd}H${-hw}Z" fill="${col}33" stroke="${col}" stroke-width="1.2" ${ns}/>`;
   case'bar':case'table':return R(-hw,-hd,w,d,col+'2a',col,0.04)+`<line x1="${-hw}" x2="${hw}" y1="${-hd+d*0.25}" y2="${-hd+d*0.25}" stroke="${col}" stroke-width="1" ${ns}/>`;
   case'crowd':{let p='';const nx=Math.max(2,Math.round(w/0.6)),ny=Math.max(2,Math.round(d/0.6));for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)p+=`<circle cx="${-hw+(i+0.5)*w/nx+((j%2)*0.1)}" cy="${-hd+(j+0.5)*d/ny}" r="0.16" fill="${col}88"/>`;return R(-hw,-hd,w,d,'none',col+'66',0.1,'stroke-dasharray="4 3"')+p;}
   case'person':return `<circle r="${hw*0.55}" fill="${col}aa"/>`;
   case'barrier':return R(-hw,-hd,w,d,'none',col,0.02,'stroke-dasharray="5 3"')+`<line x1="${-hw}" x2="${hw}" y1="0" y2="0" stroke="${col}" stroke-width="2" ${ns}/>`;
   case'post':return `<circle r="${hw*0.6}" fill="#ffd23f"/>`;
   case'ext':return `<circle r="${hw}" fill="#e23b3b"/>`;
   case'exit':return R(-hw,-hd-0.1,w,d+0.2,'#0f3a22','#3ccf8e',0.02)+(flat?'':`<text y="0.08" font-size="0.22" text-anchor="middle" fill="#3ccf8e" font-family="Inter" font-weight="700">SORTIE</text>`);
   case'aid':return R(-hw,-hd,w,d,'#ffffff18','#3ccf8e',0.05)+`<path d="M-0.1 -0.3h0.2v0.2h0.2v0.2h-0.2v0.2h-0.2v-0.2h-0.2v-0.2h0.2z" fill="#3ccf8e"/>`;
   case'pillar':return `<circle r="${Math.min(hw,hd)}" fill="#e9e4da22" stroke="#cfc9bd" stroke-width="1.4" ${ns}/>`;
   case'wall':return R(-hw,-hd,w,d,'#5b6070','#8a90a0',0.005);
   case'door':return R(-hw,-hd,w,d,'#3a3f4c','#8a90a0',0.005)+`<path d="M${-hw} ${hd}A${w} ${w} 0 0 1 ${hw} ${hd-w}" fill="none" stroke="#8a90a0" stroke-dasharray="3 3" stroke-width="1" ${ns}/>`;
   case'stairs':return R(-hw,-hd,w,d,'#e9e4da18','#cfc9bd',0.02)+Array.from({length:Math.max(3,Math.round(d/0.32))},(_,i)=>`<line x1="${-hw}" x2="${hw}" y1="${-hd+i*0.32}" y2="${-hd+i*0.32}" stroke="#cfc9bd66" stroke-width="1" ${ns}/>`).join('');
   case'mezz':return R(-hw,-hd,w,d,'url(#hatch)','#8a90a0',0.02)+`<line x1="${-hw}" x2="${hw}" y1="${-hd}" y2="${-hd}" stroke="#c9a45c" stroke-width="2.5" ${ns}/>`;
   case'aid2':default:return base;}}

function commit(){hist.push(snapshot());if(hist.length>120)hist.shift();fut=[];markDirty();}
function restore(j){const o=JSON.parse(j);Object.assign(P,o);if(sel&&!findSel())sel=null;render();}
function undo(){if(!hist.length)return;fut.push(snapshot());restore(hist.pop());markDirty();}

const findSel=()=>sel&&(sel.k==='i'?P.items.find(i=>i.id===sel.id):sel.k==='z'?P.zones.find(z=>z.id===sel.id):P.cables.find(c=>c.id===sel.id));
const defOf=it=>CAT[it.t]||C[0];
const W=it=>it.w||defOf(it).w,D=it=>it.d||defOf(it).d,Hh=it=>it.h||defOf(it).h;

/* Hauteur de pose automatique : posé sur une scène, un booth, une table, un caisson (pour les enceintes) ou accroché à un pont */
function elev(it,dp=0){if(typeof it.z==='number')return it.z;if(dp>4)return 0;const d=defOf(it);if(d.hang)return d.hang;
  let z=0;for(const o of P.items){if(o===it)continue;const od=defOf(o);if(!(od.base||od.s==='truss'))continue;if(od.s==='sub'&&!/spk|line|col/.test(d.s))continue;if(od.s==='truss'&&!/mh|par|strobe|profile|ledbar|laser|ball|spk|line|proj/.test(d.s))continue;
    if(inside(it.x,it.y,o)){const top=od.s==='truss'?elev(o,dp+1)-0.15:elev(o,dp+1)+Hh(o);if(od.s==='truss'||top>z)z=od.s==='truss'?top-Hh(it):top;}}return Math.max(0,z);}
function inside(x,y,o){const a=-(o.r||0)*Math.PI/180,dx=x-o.x,dy=y-o.y,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(lx)<=W(o)/2&&Math.abs(ly)<=D(o)/2;}
const cableLen=c=>{const a=P.items.find(i=>i.id===c.a),b=P.items.find(i=>i.id===c.b);if(!a||!b)return 0;const flat=Math.hypot(a.x-b.x,a.y-b.y),vz=Math.abs(elev(a)-elev(b));return flat*1.2+vz+elev(a)+elev(b)+1;};
const stdLen=l=>STD.find(s=>s>=l)||Math.ceil(l/10)*10;

/* ================= Rendu 2D ================= */

  <radialGradient id="bm"><stop offset="0" stop-color="#ffd23f" stop-opacity=".35"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>

  o+=`<rect x="0" y="0" width="${P.room.w}" height="${P.room.l}" fill="#15171c"/>`;
  if(layers.grid)o+=`<rect x="0" y="0" width="${P.room.w}" height="${P.room.l}" fill="url(#g1)"/><rect x="0" y="0" width="${P.room.w}" height="${P.room.l}" fill="url(#g5)"/>`;

  if(layers.zones)for(const z of P.zones){const [n,c]=ZONES[z.k]||ZONES.libre;const on=sel&&sel.k==='z'&&sel.id===z.id;
    o+=`<g data-z="${z.id}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="0.15" fill="${c}14" stroke="${on?'#5aa9ff':c}" stroke-width="${on?2:1.2}" stroke-dasharray="6 4" ${ns}/>${layers.labels?`<text x="${z.x+0.15}" y="${z.y+0.15+fz}" font-size="${fz}" fill="${c}" font-family="Inter" font-weight="600">${esc(z.label||n)} · ${fr(z.w*z.h)} m²</text>`:''}</g>`;}
  // couverture et faisceaux
  for(const it of P.items){const d=defOf(it);
    if(layers.coverage&&d.cov&&it.cov!==false){const [ang,th]=d.cov,a=ang/2*Math.PI/180;o+=`<path d="M0 0L${-Math.sin(a)*th} ${Math.cos(a)*th}A${th} ${th} 0 0 0 ${Math.sin(a)*th} ${Math.cos(a)*th}Z" fill="url(#cov)" transform="translate(${it.x} ${it.y}) rotate(${it.r||0})" pointer-events="none"/>`;}
    if(layers.beams&&d.beam){const [ang,len]=d.beam,a=ang/2*Math.PI/180,c=it.col||'#ffd23f';o+=`<path d="M0 0L${-Math.sin(a)*len} ${Math.cos(a)*len}L${Math.sin(a)*len} ${Math.cos(a)*len}Z" fill="url(#bm)" opacity=".7" transform="translate(${it.x} ${it.y}) rotate(${it.r||0})" pointer-events="none"/>`;}}
  // câbles
  if(layers.cables)for(const c of P.cables){const a=P.items.find(i=>i.id===c.a),b=P.items.find(i=>i.id===c.b);if(!a||!b)continue;const col=(CABLES[c.k]||CABLES.xlr)[1],on=sel&&sel.k==='c'&&sel.id===c.id;
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,bend=0.12;const qx=mx-dy*bend,qy=my+dx*bend;
    o+=`<g data-c="${c.id}"><path d="M${a.x} ${a.y}Q${qx} ${qy} ${b.x} ${b.y}" fill="none" stroke="transparent" stroke-width="14" ${ns}/><path d="M${a.x} ${a.y}Q${qx} ${qy} ${b.x} ${b.y}" fill="none" stroke="${on?'#5aa9ff':col}" stroke-width="${on?3.2:2}" stroke-linecap="round" ${ns} ${c.k==='dmx'?'stroke-dasharray="7 4"':''}/>

    if(on&&tool==='select'){const hy=-D(it)/2-26/s;o+=`<line x1="0" y1="${-D(it)/2-0.08}" x2="0" y2="${hy}" stroke="#5aa9ff" stroke-width="1.2" ${ns}/><circle data-rot="1" cx="0" cy="${hy}" r="${8/s}" fill="#5aa9ff" stroke="#0f1115" stroke-width="2" ${ns} style="cursor:grab"/>`;}

  cv.innerHTML=o;$('#zoomp').textContent=Math.round(vw.s/40*100)+' %';}
let ghost=null,drawZone=null;

/* ================= Interactions 2D ================= */
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const v=[...ptrs.values()];pinch={d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),s:vw.s,c:toWorld((v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2)};drag=null;return;}
  const [wx,wy]=toWorld(e.clientX,e.clientY);const g=e.target.closest('[data-i],[data-z],[data-c]'),rot=e.target.closest('[data-rot]');
  if(tool==='select'){
    if(rot&&sel){drag={mode:'rot',it:findSel(),moved:false};return;}
    if(g&&g.dataset.i){const it=P.items.find(i=>i.id===g.dataset.i);sel={k:'i',id:it.id};drag={mode:'move',it,ox:wx-it.x,oy:wy-it.y,moved:false,sx:e.clientX,sy:e.clientY};render2();panel();return;}
    if(g&&g.dataset.z){const z=P.zones.find(i=>i.id===g.dataset.z);sel={k:'z',id:z.id};drag={mode:'zmove',z,ox:wx-z.x,oy:wy-z.y,moved:false};render2();panel();return;}
    if(g&&g.dataset.c){sel={k:'c',id:g.dataset.c};render2();panel();return;}
    sel=null;drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:vw.x,vy:vw.y,moved:false};cv.classList.add('pan');render2();panel();return;}
  if(tool==='cable'){if(g&&g.dataset.i){const id=g.dataset.i;if(!cableFrom){cableFrom=id;hint('Touche maintenant l’appareil d’arrivée');render2();}
      else if(cableFrom!==id){commit();P.cables.push({id:uid(),a:cableFrom,b:id,k:cableKind});cableFrom=null;ghost=null;hint('Câble ajouté. Touche un autre appareil pour en tirer un nouveau');render();}}
    else{drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:vw.x,vy:vw.y};}return;}
  if(tool==='zone'){drawZone=[snap(wx),snap(wy),snap(wx),snap(wy)];drag={mode:'zone'};return;}
  if(tool==='measure'){measure=[wx,wy,wx,wy];drag={mode:'measure'};render2();return;}});
cv.addEventListener('pointermove',e=>{const [wx,wy]=toWorld(e.clientX,e.clientY);$('#pos').textContent=`x ${fr(wx)} · y ${fr(wy)} m`;
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const v=[...ptrs.values()];const d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);const ns=Math.max(8,Math.min(260,pinch.s*d/pinch.d));const mid=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2],r=cv.getBoundingClientRect();
    vw.s=ns;vw.x=pinch.c[0]-(mid[0]-r.left)/ns;vw.y=pinch.c[1]-(mid[1]-r.top)/ns;render2();return;}
  if(tool==='cable'&&cableFrom){ghost=[wx,wy];render2();}
  if(!drag)return;
  if(drag.mode==='pan'){if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>3)drag.moved=true;vw.x=drag.vx-(e.clientX-drag.sx)/vw.s;vw.y=drag.vy-(e.clientY-drag.sy)/vw.s;render2();return;}
  if(drag.mode==='move'){if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;commit();drag.moved=true;}drag.it.x=snap(wx-drag.ox);drag.it.y=snap(wy-drag.oy);
    const gEl=cv.querySelector(`[data-i="${drag.it.id}"]`);if(gEl)gEl.setAttribute('transform',`translate(${drag.it.x} ${drag.it.y}) rotate(${drag.it.r||0})`);updateProps();return;}
  if(drag.mode==='zmove'){if(!drag.moved){commit();drag.moved=true;}drag.z.x=snap(wx-drag.ox);drag.z.y=snap(wy-drag.oy);render2();return;}
  if(drag.mode==='rot'){if(!drag.moved){commit();drag.moved=true;}const it=drag.it;let a=Math.atan2(wx-it.x,-(wy-it.y))*180/Math.PI;a=e.shiftKey?a:Math.round(a/15)*15;it.r=((a%360)+360)%360;render2();updateProps();return;}
  if(drag.mode==='zone'){drawZone[2]=snap(wx);drawZone[3]=snap(wy);render2();return;}
  if(drag.mode==='measure'){measure[2]=wx;measure[3]=wy;render2();}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;cv.classList.remove('pan');
  if(drag){if(drag.mode==='zone'&&drawZone){const [a,b,c,d]=drawZone,w=Math.abs(c-a),h=Math.abs(d-b);if(w>0.3&&h>0.3){commit();const z={id:uid(),x:Math.min(a,c),y:Math.min(b,d),w,h,k:zoneKind,label:''};P.zones.push(z);sel={k:'z',id:z.id};setTool('select');}drawZone=null;render();}
    if(drag.mode==='move'&&drag.moved)render();if(drag.mode==='rot'&&drag.moved)render();if(drag.mode==='zmove'&&drag.moved)render();}
  drag=null;};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();const [wx,wy]=toWorld(e.clientX,e.clientY),r=cv.getBoundingClientRect();const ns=Math.max(8,Math.min(260,vw.s*(e.deltaY<0?1.12:0.89)));vw.s=ns;vw.x=wx-(e.clientX-r.left)/ns;vw.y=wy-(e.clientY-r.top)/ns;render2();},{passive:false});
const snap=v=>layers.grid?Math.round(v*10)/10:r2(v);
function zoomBy(f){const r=cv.getBoundingClientRect(),c=toWorld(r.left+r.width/2,r.top+r.height/2);vw.s=Math.max(8,Math.min(260,vw.s*f));vw.x=c[0]-r.width/2/vw.s;vw.y=c[1]-r.height/2/vw.s;render2();}
$('#zin').onclick=()=>zoomBy(1.25);$('#zout').onclick=()=>zoomBy(0.8);$('#zfit').onclick=fit;

  $('#catCount').textContent=C.length+' éléments';
  $('#cats').innerHTML=[['all','Tout','#eef0f4']].concat(Object.entries(CATS).map(([k,[n,c]])=>[k,n,c])).map(([k,n,c])=>`<button data-cat="${k}" aria-pressed="${catFilter===k}"><i style="background:${c}"></i>${n}</button>`).join('');
  const groups={};list.forEach(c=>(groups[c.cat]=groups[c.cat]||[]).push(c));
  $('#catalog').innerHTML=Object.entries(groups).map(([k,arr])=>`<div class="cat-h"><i style="background:${CATS[k][1]}"></i>${CATS[k][0]}</div><div class="tiles">${arr.map(c=>`<button class="tile" data-t="${c.t}" title="${esc(c.n)}">${tileSVG(c)}<b>${esc(c.n)}</b><small>${fr(c.w)} × ${fr(c.d)} m</small></button>`).join('')}</div>`).join('')+(list.length?'<div style="height:12px"></div>':'<div class="muted" style="padding:20px 12px">Aucun élément ne correspond.</div>');}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;catFilter=b.dataset.cat;renderCatalog();});

let dnd=null;

addEventListener('pointermove',e=>{if(!dnd)return;if(!dnd.el&&Math.hypot(e.clientX-dnd.sx,e.clientY-dnd.sy)>8){const def=CAT[dnd.t];dnd.el=document.createElement('div');dnd.el.style.cssText='position:fixed;z-index:80;pointer-events:none;width:72px;height:56px;border-radius:12px;background:#1b1e25ee;border:1px solid #5aa9ff;display:grid;place-items:center;transform:translate(-50%,-50%)';dnd.el.innerHTML=tileSVG(def);document.body.appendChild(dnd.el);if(innerWidth<=820)closeSheets();}
  if(dnd.el){dnd.el.style.left=e.clientX+'px';dnd.el.style.top=e.clientY+'px';}});
addEventListener('pointercancel',()=>{if(dnd&&dnd.el)dnd.el.remove();dnd=null;});
addEventListener('pointerup',e=>{if(!dnd)return;const d=dnd;dnd=null;if(d.el){d.el.remove();const r=cv.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const [x,y]=toWorld(e.clientX,e.clientY);addItem(d.t,x,y);}}
  else if(e.target.closest('.tile')){const r=cv.getBoundingClientRect(),[x,y]=toWorld(r.left+r.width/2,r.top+r.height/2);addItem(d.t,x,y);if(innerWidth<=820)closeSheets();}});

/* ================= Panneau droit ================= */
let rtab='props';

const updateProps=()=>{if(rtab!=='props')return;const it=findSel();if(!it||sel.k!=='i')return;const set=(id,v)=>{const e=document.getElementById(id);if(e&&document.activeElement!==e)e.value=v;};set('px',r2(it.x));set('py',r2(it.y));set('pr',Math.round(it.r||0));set('prr',Math.round(it.r||0));};

  if(tool==='cable')return `<div class="card"><h3>Outil câble</h3><div class="muted">Touche l’appareil de départ, puis celui d’arrivée. La longueur est calculée avec le mou et les hauteurs.</div><div class="cablek" id="ck">${Object.entries(CABLES).map(([k,[n,c]])=>`<button data-k="${k}" aria-pressed="${k===cableKind}"><i style="background:${c}"></i>${n}</button>`).join('')}</div></div>`;
  if(tool==='zone')return `<div class="card"><h3>Outil zone</h3><div class="muted">Trace un rectangle sur le plan. La surface s’affiche dans la zone.</div><div class="cablek" id="zk">${Object.entries(ZONES).map(([k,[n,c]])=>`<button data-k="${k}" aria-pressed="${k===zoneKind}"><i style="background:${c}"></i>${n}</button>`).join('')}</div></div>`;

/* ================= Rendu global ================= */
function render(){render2();panel();rebuild3d();$('#undo').disabled=!hist.length;$('#redo').disabled=!fut.length;}

/* ================= Export ================= */
async function offer(name,data){if(dl){try{await dl.save({filename:name,data});toast('Fichier enregistré');}catch(e){toast(e&&e.code==='declined'?'Enregistrement annulé':'Enregistrement impossible ici');}return;}
  const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Fichier téléchargé');}
const slug=()=>P.name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'plan';
async function exportPNG(){const prev={...vw};const sc=48,m=1.5,Wp=Math.round((P.room.w+m*2)*sc),Hp=Math.round((P.room.l+m*2)*sc)+90;vw={x:-m,y:-m,s:sc};const keep=sel;sel=null;
  const clone=cv.cloneNode(false);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',Wp);clone.setAttribute('height',Hp-90);
  const r={left:0,top:0,width:Wp,height:Hp-90};const orig=cv.getBoundingClientRect;cv.getBoundingClientRect=()=>r;render2();clone.setAttribute('viewBox',cv.getAttribute('viewBox'));clone.innerHTML=cv.innerHTML;cv.getBoundingClientRect=orig;vw=prev;sel=keep;render2();
  const img=new Image();const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;}).catch(()=>{});const c=document.createElement('canvas');c.width=Wp;c.height=Hp;const g=c.getContext('2d');g.fillStyle='#0f1115';g.fillRect(0,0,Wp,Hp);g.drawImage(img,0,0);URL.revokeObjectURL(url);
  g.fillStyle='#ff5a1f';g.fillRect(0,Hp-90,Wp,3);g.fillStyle='#eef0f4';g.font='800 26px "Bricolage Grotesque", sans-serif';g.fillText(P.name,24,Hp-50);g.fillStyle='#7d8291';g.font='15px Inter, sans-serif';
  g.fillText(`${P.items.length} éléments · ${P.cables.length} câbles · salle ${fr(P.room.w)} × ${fr(P.room.l)} m`,24,Hp-24);g.textAlign='right';g.fillStyle='#ff5a1f';g.font='800 17px "Bricolage Grotesque", sans-serif';g.fillText('Fait par DJ RON',Wp-24,Hp-38);
  c.toBlob(b=>b&&offer(slug()+'-plan.png',b),'image/png');}
function exportCSV(){const cnt={};P.items.forEach(i=>{cnt[i.t]=(cnt[i.t]||0)+1;});let s='Catégorie;Élément;Quantité;Puissance estimée (W)\n';Object.entries(cnt).forEach(([t,n])=>{const d=CAT[t];s+=`${CATS[d.cat][0]};${d.n};${n};${(d.p||0)*n}\n`;});
  const cab={};P.cables.forEach(c=>{const k=CABLES[c.k][0]+';'+stdLen(cableLen(c))+' m';cab[k]=(cab[k]||0)+1;});s+='\nCâble;Longueur;Quantité\n';Object.entries(cab).forEach(([k,n])=>{s+=`${k};${n}\n`;});offer(slug()+'-inventaire.csv','﻿'+s);}
$('#exportBtn').onclick=()=>dlg(`<h3 style="margin:0;font:800 18px var(--display)">Exporter « ${esc(P.name)} »</h3><div style="display:grid;gap:8px"><button class="btn" id="xPng">Image du plan (PNG)</button><button class="btn" id="xCsv">Inventaire et câbles (CSV pour Excel)</button><button class="btn" id="xJson">Fichier du plan (JSON, pour le réimporter)</button><label class="btn" style="cursor:pointer">Importer un fichier de plan<input type="file" accept=".json,application/json" id="xImp" hidden></label></div><button class="btn" data-close>Fermer</button>`);
$('#dlg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='xPng'){$('#dlg').close();exportPNG();}if(b.id==='xCsv'){$('#dlg').close();exportCSV();}if(b.id==='xJson'){$('#dlg').close();offer(slug()+'.json',JSON.stringify(P,null,1));}});
$('#dlg').addEventListener('change',async e=>{if(e.target.id!=='xImp'||!e.target.files[0])return;try{const o=JSON.parse(await e.target.files[0].text());if(!o.items||!o.room)throw 0;o.id='p'+uid();store.projects.push(o);P=o;markDirty();fillProjects();$('#dlg').close();fit();render();toast('Plan importé');}catch(_){toast('Ce fichier n’est pas un plan valide');}});

/* ================= Enregistrement ================= */
$('#save').onclick=async()=>{const b=$('#save');if(!art||!owner){try{localStorage.setItem('djron-studio-draft',JSON.stringify(store));}catch(e){}toast(art?'Enregistrement réservé à l’admin : brouillon gardé sur cet appareil':'Brouillon gardé sur cet appareil');return;}
  b.classList.add('is-loading');try{await art.publish({'data/projects.json':{content:JSON.stringify(store),contentType:'application/json'}});dirty=false;b.classList.remove('is-dirty');toast('Plans enregistrés');}
  catch(e){toast(e&&e.code==='conflict'?'Une autre version a été enregistrée, la page va se recharger':'Échec de l’enregistrement ('+(e&&e.code||'erreur')+')');}b.classList.remove('is-loading');};
addEventListener('beforeunload',e=>{if(dirty&&owner){e.preventDefault();e.returnValue='';}});

/* ================= Démarrage ================= */
renderCatalog();
(async()=>{let data=null;try{const r=await fetch('data/projects.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}
  let draft=null;try{draft=JSON.parse(localStorage.getItem('djron-studio-draft')||'null');}catch(e){}
  store=data&&data.projects&&data.projects.length?data:{projects:[]};if(!store.projects.length){const p=blank('LEHAIIM · Bal du Nouvel An');loadTemplate(p);store.projects.push(p,blank('Péniche'),blank('Seguin Sound'),blank('Jump'));}
  P=store.projects[0];fillProjects();$('#undo').disabled=true;$('#redo').disabled=true;requestAnimationFrame(()=>{fit();render();});
  if(draft&&draft.projects&&JSON.stringify(draft)!==JSON.stringify(store)){setTimeout(()=>dlg(`<h3 style="margin:0;font:800 18px var(--display)">Brouillon trouvé</h3><div class="muted">Des modifications non enregistrées sont gardées sur cet appareil.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="useDraft">Reprendre le brouillon</button><button class="btn" id="dropDraft" data-close>Ignorer</button></div>`),400);
    document.addEventListener('click',function h(e){if(e.target.id==='useDraft'){store=draft;P=store.projects[0];fillProjects();$('#dlg').close();fit();render();markDirty();document.removeEventListener('click',h);}if(e.target.id==='dropDraft'){try{localStorage.removeItem('djron-studio-draft');}catch(_){}document.removeEventListener('click',h);}});}
  if(window.claude&&typeof window.claude.use==='function'){const [a,u,d]=await Promise.all([window.claude.use('artifact').catch(()=>null),window.claude.use('user').catch(()=>null),window.claude.use('downloads').catch(()=>null)]);
    art=a;dl=d;owner=!!(u&&await u.isOwner().catch(()=>false));if(!owner)$('#save').querySelector('span:last-child').textContent='Brouillon';}})();
addEventListener('resize',()=>{render2();resize3d();});
</script>
